# Kept in ruff.toml rather than pyproject.toml on purpose: a pyproject.toml
# inside the Docker build context can change how a platform auto-detects the
# build (poetry/pdm/nixpacks). This file is only ever read by ruff.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced here
    "B008",  # FastAPI's Depends/File/Body defaults are calls by design
    "UP042", # str+Enum is deliberate: .value is relied on across the API
]

[lint.per-file-ignores]
# Package re-exports are the point of these files.
"app/models/__init__.py" = ["F401"]
"app/**/__init__.py" = ["F401"]
# Tests reach into internals deliberately.
"tests/*" = ["B011"]
